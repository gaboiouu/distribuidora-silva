name: Backend CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: silva
          POSTGRES_PASSWORD: test-local-only
          POSTGRES_DB: silva_test
        ports: ['5432:5432']
        options: --health-cmd="pg_isready -U silva" --health-interval=5s --health-retries=10
    env:
      DATABASE_URL: postgresql://silva:test-local-only@localhost:5432/silva_test
      JWT_SECRET: test-only-secret-with-at-least-48-characters-00000000
      CORS_ORIGIN: http://localhost:5173
      NODE_ENV: test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run format:check
      - run: npm run build
      - run: npm test
      - run: docker build -t silva-backend:ci .
