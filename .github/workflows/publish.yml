name: Publish tested backend
on:
  workflow_run:
    workflows: [Backend CI]
    types: [completed]
permissions:
  contents: read
  packages: write
jobs:
  image:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Login to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and publish immutable tag
        env:
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}-backend:$COMMIT_SHA"
          docker build -t "$IMAGE" backend
          docker push "$IMAGE"
